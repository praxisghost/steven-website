# Railway config for the stevenlegg.xyz (website-xyz branch) Next.js frontend.
# Lives in the service Root Directory (frontend/). Overrides any cached config
# from the main branch. Builder is left unset so Railway uses its current
# default (auto-detects Next.js: runs `next build`, then the start command below).

[deploy]
startCommand = "npx next start -p $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
