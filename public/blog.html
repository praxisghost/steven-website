<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — Steven Legg</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="back-link" href="writing.html">← Writing</a>

  <header>
    <h1>Blog</h1>
  </header>

  <article>
    <p class="blog-intro">Longer thoughts. Updated when something feels worth writing down.</p>

    <ul class="blog-list">
      <li>
        <div class="article-card-left">
          <div class="article-thumb" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="2" width="16" height="20" rx="2"/>
              <line x1="8" y1="9" x2="16" y2="9"/>
              <line x1="8" y1="13" x2="16" y2="13"/>
              <line x1="8" y1="17" x2="12" y2="17"/>
            </svg>
          </div>
          <a href="blog/may-2026-update.html">May 2026 Update</a>
        </div>
        <span class="blog-date">May 2026</span>
      </li>
    </ul>
    <div class="save-article-btn-wrap">
    <button class="save-article-btn" id="save-article-btn" type="button">
      <span id="save-article-icon">🔖</span>
      <span id="save-article-label">Save this page</span>
    </button>
  </div>
</article>

  <footer>
    <a href="https://linktr.ee/stevenlegg" target="_blank" rel="noopener noreferrer">https://linktr.ee/stevenlegg</a>
    <a href="account.html" class="footer-account-link">Account</a>
  </footer>

  <script src="script.js"></script>
  <script>
  /* Save Article — saves/unsaves current page to account bookmarks */
  (function () {
    const btn   = document.getElementById('save-article-btn');
    const icon  = document.getElementById('save-article-icon');
    const label = document.getElementById('save-article-label');
    if (!btn) return;
    const url = '/' + window.location.pathname.split('/').pop();

    function setSaved(saved) {
      if (saved) {
        btn.classList.add('saved');
        icon.textContent  = '✅';
        label.textContent = 'Saved';
      } else {
        btn.classList.remove('saved');
        icon.textContent  = '🔖';
        label.textContent = 'Save this page';
      }
    }

    // Check if already saved (requires login; fail silently if not)
    fetch('/api/guides/saved', { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (list) {
        const saved = list.some(function (g) { return g.guide_url === url; });
        setSaved(saved);
      })
      .catch(function () {});

    btn.addEventListener('click', function () {
      const isSaved = btn.classList.contains('saved');
      fetch('/api/guides/save', {
        method:      'POST',
        headers:     { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body:        JSON.stringify({ url: url, remove: isSaved }),
      })
        .then(function (r) {
          if (r.status === 401) {
            window.location.href = 'login.html';
            return;
          }
          if (r.ok) setSaved(!isSaved);
        })
        .catch(function () {});
    });
  })();
  </script>
</body>
</html>
