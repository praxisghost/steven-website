<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Steven Legg</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="back-link" href="index.html">← Back</a>

  <header>
    <h1>Contact</h1>
  </header>

  <article>
    <h2>Send a message</h2>
    <form id="contact-form" novalidate>
      <input type="text"  name="name"    placeholder="Your name"    required
             aria-label="Your name"    autocomplete="name"     maxlength="100">
      <input type="email" name="email"   placeholder="Your email"   required
             aria-label="Your email"   autocomplete="email"    maxlength="254"
             inputmode="email">
      <textarea           name="message" placeholder="Your message" required
             aria-label="Your message" maxlength="5000"></textarea>
      <button type="submit">Send</button>
    </form>
    <p id="form-status" role="status" aria-live="polite"></p>

    <hr class="section-divider">

    <h2>Newsletter</h2>
    <p>Occasional updates when I write something worth sharing. No spam.</p>
    <form id="newsletter-form" novalidate>
      <input type="email" name="email" placeholder="Your email address" required
             aria-label="Your email address" autocomplete="email" maxlength="254"
             inputmode="email">
      <button type="submit">Subscribe</button>
    </form>
    <p id="newsletter-status" role="status" aria-live="polite"></p>
  </article>

  <footer>
    <a href="https://linktr.ee/stevenlegg" target="_blank" rel="noopener noreferrer">https://linktr.ee/stevenlegg</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
