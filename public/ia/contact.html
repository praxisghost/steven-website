<!DOCTYPE html>
<html lang="ia">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — Steven Legg</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <a class="back-link" href="index.html">← Retro</a>

  <header>
    <h1>Contacto</h1>
  </header>

  <article>
    <h2>Inviar un message</h2>
    <form id="contact-form" novalidate>
      <input type="text"  name="name"    placeholder="Vostre nomine"    required
             aria-label="Vostre nomine"    autocomplete="name"     maxlength="100">
      <input type="email" name="email"   placeholder="Vostre e-mail"    required
             aria-label="Vostre e-mail"   autocomplete="email"    maxlength="254"
             inputmode="email">
      <textarea           name="message" placeholder="Vostre message"   required
             aria-label="Vostre message" maxlength="5000"></textarea>
      <button type="submit">Inviar</button>
    </form>
    <p id="form-status" role="status" aria-live="polite"></p>

    <hr class="section-divider">

    <h2>Bulletino informative</h2>
    <p>Actualisationes occasional quando io scribe alque digne de partir. Sin spam.</p>
    <form id="newsletter-form" novalidate>
      <input type="email" name="email" placeholder="Vostre adresse de e-mail" required
             aria-label="Vostre adresse de e-mail" autocomplete="email" maxlength="254"
             inputmode="email">
      <button type="submit">Subscriber</button>
    </form>
    <p id="newsletter-status" role="status" aria-live="polite"></p>
  </article>

  <footer>
    <a href="https://linktr.ee/stevenlegg" target="_blank" rel="noopener noreferrer">https://linktr.ee/stevenlegg</a>
  </footer>

  <script src="../script.js"></script>
</body>
</html>
