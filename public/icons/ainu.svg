<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Ainu">
  <!-- Ainu cultural icon inspired by traditional textile patterns (upsor/morreu).
       The "morreu" (spiral) and geometric band patterns are signature Ainu motifs.
       Dark indigo background (traditional Ainu cloth is deep blue/indigo),
       white geometric band with scroll-like corner marks — a simplified upsor band. -->
  <rect width="32" height="32" fill="#1A2744" rx="2"/>
  <!-- Horizontal band across middle — white -->
  <rect y="12" width="32" height="8" fill="white"/>
  <!-- Morreu (scroll) motifs at each end of the band -->
  <!-- Left scroll -->
  <path d="M 4 16 C 4 13 7 11 9 13 C 11 15 9 19 6 19 C 3 19 2 16 4 14"
        fill="none" stroke="#1A2744" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right scroll -->
  <path d="M 28 16 C 28 13 25 11 23 13 C 21 15 23 19 26 19 C 29 19 30 16 28 14"
        fill="none" stroke="#1A2744" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center diamond ornament on the band -->
  <polygon points="16,13 19,16 16,19 13,16" fill="#1A2744"/>
  <!-- Small accent dots flanking center diamond -->
  <circle cx="11" cy="16" r="1.2" fill="#1A2744"/>
  <circle cx="21" cy="16" r="1.2" fill="#1A2744"/>
  <!-- Top and bottom thin accent lines (traditional multi-band pattern) -->
  <rect y="9" width="32" height="2" fill="#4A6FA5"/>
  <rect y="21" width="32" height="2" fill="#4A6FA5"/>
</svg>
