<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Cherokee">
  <!-- Cherokee Nation flag-inspired icon:
       Gold background, central 7-pointed star in dark red, wreath ring of leaves.
       The Cherokee Nation seal uses a 7-pointed star representing the 7 clans. -->
  <circle cx="16" cy="16" r="15" fill="#C8990A"/>
  <!-- Outer wreath ring -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#2D5016" stroke-width="3" stroke-dasharray="2.5 1.5"/>
  <!-- Inner gold field -->
  <circle cx="16" cy="16" r="11" fill="#C8990A"/>
  <!-- 7-pointed star in dark red -->
  <polygon points="16,4 17.6,11.2 24,10 19.8,15 24,20 17.6,20.8 16,28 14.4,20.8 8,20 12.2,15 8,10 14.4,11.2" fill="#8B1A1A"/>
  <!-- Star center highlight -->
  <circle cx="16" cy="15" r="2.5" fill="#C8990A"/>
</svg>
