<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Navajo">
  <!-- Navajo Nation flag-inspired icon:
       Sandy/tan background with traditional sand-painting diamond pattern.
       Colors: tan, terracotta red, white, dark brown — evoke earth and sky.
       The diamond (rhombus) is a central motif in Navajo weaving. -->
  <rect width="32" height="32" fill="#D4A84B" rx="2"/>
  <!-- Outer border stripes: dark brown -->
  <rect width="32" height="4" fill="#5C2E0A"/>
  <rect y="28" width="32" height="4" fill="#5C2E0A"/>
  <!-- Terracotta side accents -->
  <rect width="4" height="24" y="4" fill="#A0391A"/>
  <rect x="28" width="4" height="24" y="4" fill="#A0391A"/>
  <!-- Central diamond — white outline -->
  <polygon points="16,6 26,16 16,26 6,16" fill="white"/>
  <!-- Central diamond — terracotta fill -->
  <polygon points="16,9 23,16 16,23 9,16" fill="#A0391A"/>
  <!-- Inner diamond — tan -->
  <polygon points="16,12 20,16 16,20 12,16" fill="#D4A84B"/>
  <!-- Center dot — dark brown -->
  <circle cx="16" cy="16" r="2" fill="#5C2E0A"/>
</svg>
