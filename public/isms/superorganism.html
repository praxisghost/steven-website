<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>superorganism — Steven Legg</title>
  <meta name="description" content="An interactive Three.js knowledge graph of the entire website — every page is a node, every node a place to explore.">
  <link rel="stylesheet" href="../style.css">
  <style>
    /* The Superorganism page is a full-viewport graph, so it overrides the
       site's centred-column body layout for this page only. */
    html, body { height: 100%; }
    body {
      max-width: none; margin: 0; padding: 0;
      overflow: hidden; background: #000;
    }
    #superorganism {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      background: #000; /* OLED black — Obsidian graph aesthetic */
      cursor: grab; touch-action: none;
    }
    #superorganism.dragging { cursor: grabbing; }
    #so-canvas { display: block; width: 100%; height: 100%; }

    /* Floating hover label */
    #so-label {
      position: fixed; pointer-events: none; z-index: 6;
      transform: translate(-50%, -160%);
      padding: 3px 9px; border-radius: 6px;
      background: rgba(12,12,14,0.92); border: 1px solid rgba(255,255,255,0.12);
      color: #fff; font-family: var(--font-body); font-size: 13px; line-height: 1.3;
      white-space: nowrap; opacity: 0; transition: opacity .12s ease;
      box-shadow: 0 4px 18px rgba(0,0,0,.6);
    }
    #so-label.show { opacity: 1; }

    /* Overlay chrome */
    .so-overlay { position: fixed; z-index: 5; font-family: var(--font-body); color: #cfd2d6; }
    #so-back {
      top: 14px; left: 16px; font-size: 14px; text-decoration: none;
      color: #cfd2d6; background: rgba(18,18,20,0.6);
      padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(4px);
    }
    #so-back:hover { color: #fff; border-color: rgba(255,255,255,0.2); }

    #so-title {
      top: 14px; left: 50%; transform: translateX(-50%);
      font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
      color: #6b6f76; pointer-events: none; text-align: center;
    }

    #so-legend {
      bottom: 14px; left: 16px; max-width: 46vw;
      display: flex; flex-wrap: wrap; gap: 5px 14px;
      background: rgba(14,14,16,0.6); padding: 10px 12px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.07); backdrop-filter: blur(4px);
      font-size: 12px;
    }
    #so-legend .item { display: flex; align-items: center; gap: 6px; cursor: pointer; opacity: .85; }
    #so-legend .item:hover { opacity: 1; }
    #so-legend .item.dim { opacity: .3; }
    #so-legend .dot { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 6px currentColor; }

    #so-hud {
      bottom: 14px; right: 16px; text-align: right; font-size: 12px; color: #6b6f76;
      background: rgba(14,14,16,0.55); padding: 8px 12px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06); backdrop-filter: blur(4px); line-height: 1.5;
    }
    #so-hud b { color: #cfd2d6; font-weight: 600; }

    /* Search */
    #so-search {
      top: 14px; right: 16px;
    }
    #so-search input {
      width: 190px; background: rgba(18,18,20,0.7); color: #fff;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
      padding: 6px 10px; font-size: 13px; font-family: var(--font-body);
      outline: none;
    }
    #so-search input:focus { border-color: rgba(255,255,255,0.28); }

    #so-loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #6b6f76; font-family: var(--font-body); font-size: 14px; z-index: 7;
      background: #000; transition: opacity .4s ease;
    }
    #so-loading.hide { opacity: 0; pointer-events: none; }

    @media (max-width: 640px) {
      #so-search input { width: 120px; }
      #so-legend { max-width: 60vw; }
      #so-title { display: none; }
    }
  </style>
</head>
<body>
  <div id="superorganism">
    <canvas id="so-canvas"></canvas>
  </div>

  <a id="so-back" class="so-overlay" href="../isms.html">← -isms</a>
  <div id="so-title" class="so-overlay">Superorganism · a living map of the site</div>
  <div id="so-search" class="so-overlay"><input id="so-search-input" type="text" placeholder="Search pages…" autocomplete="off" spellcheck="false"></div>
  <div id="so-legend" class="so-overlay"></div>
  <div id="so-hud" class="so-overlay"></div>
  <div id="so-label"></div>
  <div id="so-loading">Summoning the superorganism…</div>

  <script type="module" src="superorganism.js"></script>
  <noscript>
    <p style="color:#888; padding:2rem; font-family:sans-serif;">
      The Superorganism graph needs JavaScript. Meanwhile, you can browse the site
      from the <a href="../isms.html" style="color:#9af;">-isms index</a>.
    </p>
  </noscript>
</body>
</html>
