<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Steven Legg</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="back-link" href="index.html">← Back</a>

  <header>
    <h1>Sign In</h1>
  </header>

  <article>

    <form id="login-form" novalidate>
      <input
        type="email"
        name="email"
        id="email"
        placeholder="Email address"
        required
        aria-label="Email address"
        autocomplete="email"
        maxlength="254"
        inputmode="email"
      >
      <input
        type="password"
        name="password"
        id="password"
        placeholder="Password"
        required
        aria-label="Password"
        autocomplete="current-password"
        maxlength="128"
      >
      <button type="submit">Sign In</button>
    </form>

    <p id="login-status" class="auth-status" role="status" aria-live="polite"></p>

    <p class="auth-meta"><a href="reset-password.html">Forgot password?</a></p>
    <p class="auth-meta" style="margin-top:0.75rem;">No account yet? <a href="signup.html">Create one</a></p>

  </article>

  <footer>
    <a href="https://linktr.ee/stevenlegg" target="_blank" rel="noopener noreferrer">https://linktr.ee/stevenlegg</a>
  </footer>

  <script>
    (function () {
      'use strict';

      const form   = document.getElementById('login-form');
      const status = document.getElementById('login-status');

      // If already logged in, redirect to account page
      fetch('/api/auth/me', { credentials: 'same-origin' })
        .then(r => { if (r.ok) window.location.href = 'account.html'; })
        .catch(() => {});

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        status.textContent = '';
        status.className   = 'auth-status';

        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
          status.textContent = 'Please enter your email and password.';
          status.classList.add('error');
          return;
        }

        const btn = form.querySelector('button[type="submit"]');
        btn.disabled    = true;
        btn.textContent = 'Signing in…';

        try {
          const res  = await fetch('/api/auth/login', {
            method:      'POST',
            headers:     { 'Content-Type': 'application/json' },
            body:        JSON.stringify({ email, password }),
            credentials: 'same-origin',
          });
          const data = await res.json();

          if (res.ok) {
            window.location.href = 'account.html';
          } else {
            status.textContent = data.error || 'Sign-in failed.';
            status.classList.add('error');
            btn.disabled    = false;
            btn.textContent = 'Sign In';
          }
        } catch {
          status.textContent = 'Network error. Please try again.';
          status.classList.add('error');
          btn.disabled    = false;
          btn.textContent = 'Sign In';
        }
      });
    })();
  </script>
</body>
</html>
