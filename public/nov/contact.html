<!DOCTYPE html>
<html lang="nov">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakte — Steven Legg</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <a class="back-link" href="index.html">← Retro</a>

  <header>
    <h1>Kontakte</h1>
  </header>

  <article>
    <h2>Sende messaje</h2>
    <form id="contact-form" novalidate>
      <input type="text"  name="name"    placeholder="Vun nome"     required
             aria-label="Vun nome"     autocomplete="name"     maxlength="100">
      <input type="email" name="email"   placeholder="Vun e-poste" required
             aria-label="Vun e-poste" autocomplete="email"    maxlength="254"
             inputmode="email">
      <textarea           name="message" placeholder="Vun messaje" required
             aria-label="Vun messaje" maxlength="5000"></textarea>
      <button type="submit">Sende</button>
    </form>
    <p id="form-status" role="status" aria-live="polite"></p>

    <hr class="section-divider">

    <h2>Notiziosi-letre</h2>
    <p>Okasioni informationes kand me skribe alko digni de partito. Sin spam.</p>
    <form id="newsletter-form" novalidate>
      <input type="email" name="email" placeholder="Vun e-postal adrese" required
             aria-label="Vun e-postal adrese" autocomplete="email" maxlength="254"
             inputmode="email">
      <button type="submit">Subskripte</button>
    </form>
    <p id="newsletter-status" role="status" aria-live="polite"></p>
  </article>

  <footer>
    <a href="https://linktr.ee/stevenlegg" target="_blank" rel="noopener noreferrer">https://linktr.ee/stevenlegg</a>
  </footer>

  <script src="../script.js"></script>
</body>
</html>
